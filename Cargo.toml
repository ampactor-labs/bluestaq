[package]
name = "notes"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
